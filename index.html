<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>The White Lotus</title>

  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <h1>The White Lotus</h1>

  <section id="matchup-controls" class="matchup-controls">
    <h2>Matchup Selector</h2>

    <div class="matchup-row">
      <label for="player1-element-select">Player 1</label>
      <select id="player1-element-select">
        <option value="Fire">Fire</option>
        <option value="Air" selected>Air</option>
        <option value="Earth">Earth</option>
        <option value="Water">Water</option>
      </select>

      <span class="versus-label">vs</span>

      <label for="player2-element-select">Player 2</label>
      <select id="player2-element-select">
        <option value="Fire">Fire</option>
        <option value="Air">Air</option>
        <option value="Earth">Earth</option>
        <option value="Water" selected>Water</option>
      </select>

      <button id="start-matchup-button">Start Matchup</button>
    </div>
  </section>

  <div id="game">
    <section class="player-area enemy">
      <h2 id="enemy-name">Player 2</h2>
      <p>HP: <span id="enemy-hp">30</span></p>
      <p>Chi: <span id="enemy-chi">0</span>/<span id="enemy-max-chi">0</span></p>
      <p>Deck: <span id="enemy-deck-count">0</span> | Hand: <span id="enemy-hand-count">0</span></p>

      <h3>Enemy board</h3>
      <div id="enemy-board" class="board"></div>
    </section>

    <hr />

    <section class="player-area current">
      <h2 id="player-name">Player 1</h2>
      <p>HP: <span id="player-hp">30</span></p>
      <p>Chi: <span id="player-chi">0</span>/<span id="player-max-chi">0</span></p>
      <p>Deck: <span id="player-deck-count">0</span> | Hand: <span id="player-hand-count">0</span></p>
      <p>Phase: <span id="phase-name">Action Phase</span></p>

      <h3>Your board</h3>
      <div id="player-board" class="board"></div>

      <p id="game-message"></p>

      <h3>Your hand</h3>
      <div id="player-hand" class="hand"></div>

      <div class="button-row">
        <button id="end-turn-button">End Turn</button>
        <button id="confirm-mulligan-button" class="hidden">Confirm Mulligan</button>
        <button id="restart-button">Restart Game</button>
        <button id="copy-log-button">Copy Game Log</button>
      </div>
    </section>
  </div>

  <div id="win-screen" class="win-screen hidden">
    <div class="win-panel">
      <h2 id="win-title">Player wins!</h2>

      <div id="match-summary" class="match-summary">
        <p>The match is over.</p>
      </div>

      <div class="button-row">
        <button id="win-copy-log-button">Copy Game Log</button>
        <button id="win-restart-button">Restart Game</button>
      </div>
    </div>
  </div>

  <script src="cards.js"></script>
  <script src="main.js"></script>
</body>

</html>
